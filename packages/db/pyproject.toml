[project]
name = "db"
version = "0.1.0"
description = "Models + engine + Alembic migrations (the hello-world schema)"
requires-python = ">=3.14"
# Core stays dependency-light so both the webapp and the pipelines can import
# the models without dragging in each other's stacks.
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
# Alembic, so the image (workflows carries db[migrate]) and CI can run
# `alembic upgrade head`; kept as an extra so plain importers stay slim.
migrate = [
    "alembic>=1.15",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
