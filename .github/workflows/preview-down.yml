name: Preview Down

# Destroy a PR's preview — the name-prefixed workloads, the ephemeral bucket,
# and the copy-on-write Neon branches — when the PR closes (merged or not) OR
# when its `preview` label is removed, so a preview can be parked while the PR
# stays open. Destroying a workspace that never existed is a cheap no-op, so
# closing a never-labeled PR is fine.
#
# tether mode (FORK_PROVIDER=tether) adds data-down AFTER the destroy, once the
# pods have stopped writing: every fork the preview wrote is discarded, merged
# or not, and any store the PR itself created is deleted -- prod recomputes
# with the merged code. See .github/scripts/tether-down.sh for why, the order
# and the reasons.

on:
  pull_request:
    types: [closed, unlabeled]

# Same group as preview-up.yml so a teardown never races an in-flight apply.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  down:
    # `unlabeled` fires once per removed label; only the `preview` label matters.
    if: ${{ vars.CLUSTER_NAME != '' && (github.event.action == 'closed' || github.event.label.name == 'preview') }}
    uses: Rosebud-Biosciences/lab-platform/.github/workflows/preview-down.yml@v0.2.0
    with:
      preview_name: pr${{ github.event.pull_request.number }}
      working_directory: infra/preview
      role_to_assume: ${{ vars.PREVIEW_ROLE_ARN }}
      cluster_name: ${{ vars.CLUSTER_NAME }}
      aws_region: ${{ vars.AWS_REGION }}
      tailscale: true
    secrets:
      neon_api_key: ${{ secrets.NEON_API_KEY }}
      ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}

  data-down:
    needs: down
    if: ${{ !cancelled() && needs.down.result == 'success' && vars.CLUSTER_NAME != '' && vars.FORK_PROVIDER == 'tether' && (github.event.action == 'closed' || github.event.label.name == 'preview') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # deletes the pr<N> bookmark branch
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Prefix under which a PR-created store may be deleted; unset skips that
      # step.
      DATA_ROOT_URI: ${{ vars.DATA_ROOT_URI }}
      DATASET_ROOT: ${{ vars.DATASET_ROOT || 'packages/dataset' }}
    steps:
      # The PR's merge ref is gone once it closes; work from the default branch
      # and let the script fetch the bookmarks it needs.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # tether gc keeps the pins any commit's manifests reference
          submodules: true # a dataset consumed from its own repo rides in as a submodule

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DATA_ROLE_ARN || vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.3"
          enable-cache: true

      - run: uv sync --frozen

      - run: .github/scripts/tether-down.sh "pr${{ github.event.pull_request.number }}"
