name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-uv stopped publishing moving major tags at v8; pin the full
      # version (dependabot bumps exact pins).
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.3"
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: uv run ty check

      - run: uv run pytest
