# tether dataset: the data this app reads and writes, one manifest per object
# under .tether/objects/. This directory is the dataset root AND the Python
# package (src/dataset) that names these objects in code; the enclosing git/jj
# repository is the app's, so a commit names code and data together. A dataset
# shared by several codebases moves to a repository of its own and comes back
# as a git submodule (README "Where the dataset lives").
#
# Every locator below is a placeholder (your-data-bucket, your-neon-project,
# the table bucket ARN): adopting the template means `tether add` / editing
# them to your real stores -- see README "Ephemeral data" and "Adopt this
# template". Nothing is contacted until a command asks for a state.
#
# Written by tether 0.1.0a10. When you move to a newer tether, run
# `tether upgrade` (it migrates the format) and follow its notes; b1 moves the
# Iceberg catalog `uri` below into the untracked .tether/secrets.toml.

[tether]
version = 4

[dataset]
id = "6e117556"

[snapshot]
auto = false

[verify]
on_status = false

[new]
# Previews fork every object up front (CI's fork-data job runs `tether new -b
# pr<N>`), so the branch names it hands the pods exist before the first write.
fork = "eager"

[defaults]
file = "immutable"
pin = "native"

# pyiceberg catalog for every iceberg object (lake/*): S3 Tables' Iceberg REST
# endpoint, SigV4-signed with the ambient AWS credentials. `warehouse` is the
# table bucket ARN. Local runs override it with the ICEBERG_CATALOG env var
# (see src/dataset/openers.py) and never read this table.
[backends.iceberg]
catalog = { type = "rest", uri = "https://s3tables.us-west-2.amazonaws.com/iceberg", warehouse = "arn:aws:s3tables:us-west-2:123456789012:bucket/your-table-bucket", "rest.sigv4-enabled" = "true", "rest.signing-name" = "s3tables", "rest.signing-region" = "us-west-2" }
