[project]
name = "app"
version = "0.1.0"
description = "Hello-world FastAPI webapp (the workloads module's enable_webapp target)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "db",
    # OIDC login against the platform's issuer (app.auth): Authlib's Starlette
    # client (which needs an HTTP client at import: httpx2, httpx's maintained
    # successor, which Authlib prefers), the signed cookie it keeps its OAuth
    # state in, and joserfc to verify ID tokens oauth2-proxy forwards.
    "authlib>=1.8",
    "httpx2>=2.13",
    "itsdangerous>=2.2",
    "joserfc>=1.7",
    # Reactive notebooks served BY the app (see app.main's /notebooks mount).
    "marimo>=0.13",
    # The DATA_REFS contract (no store libraries): /data shows what the app is wired to.
    "dataset",
]

[tool.uv.sources]
db = { workspace = true }
dataset = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
