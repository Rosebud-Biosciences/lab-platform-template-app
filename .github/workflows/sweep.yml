name: Preview Sweep

# Nightly belt-and-braces: destroy any pr* preview workspaces whose PR is no
# longer open (missed teardowns, force-closed PRs, flaky runners). In tether
# mode the same sweep then retires any pr* tether bookmark whose PR is closed,
# discarding its forks as preview-down.yml's data-down does.

# Inert until adopted: every job here is gated on the CLUSTER_NAME repository
# variable, which an adopter sets anyway (README "Adopt this template"). In the
# template repo itself there is no cluster to deploy to, so the run is skipped
# rather than failed -- a red X for "not configured" trains people to ignore
# red X's.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      iam_min_age_hours:
        description: "Retire orphaned /preview/ IAM only once older than this many hours (scheduled runs: 24)"
        type: string
        default: "24"

# pull-requests: read is load-bearing — the reusable sweep asks each pr<N>
# workspace's PR whether it's still open, and a called workflow can't hold
# permissions its caller didn't grant. Without it (on private repos) every
# lookup fails and the sweep silently keeps everything.
permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sweep:
    if: ${{ vars.CLUSTER_NAME != '' }}
    uses: Rosebud-Biosciences/lab-platform/.github/workflows/nightly-sweep.yml@v0.3.0
    with:
      working_directory: infra/preview
      role_to_assume: ${{ vars.PREVIEW_ROLE_ARN }}
      cluster_name: ${{ vars.CLUSTER_NAME }}
      aws_region: ${{ vars.AWS_REGION }}
      iam_min_age_hours: ${{ fromJSON(inputs.iam_min_age_hours || '24') }}
      tailscale: true
    secrets:
      neon_api_key: ${{ secrets.NEON_API_KEY }}
      ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}

  tether-sweep:
    needs: sweep
    if: ${{ !cancelled() && vars.CLUSTER_NAME != '' && vars.FORK_PROVIDER == 'tether' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # deletes retired pr<N> bookmark branches
      pull-requests: read
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DATA_ROOT_URI: ${{ vars.DATA_ROOT_URI }}
      GH_TOKEN: ${{ github.token }}
      DATASET_ROOT: ${{ vars.DATASET_ROOT || 'packages/dataset' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tether gc keeps the pins any commit's manifests reference
          submodules: true # a dataset consumed from its own repo rides in as a submodule

      # TEARDOWN_ROLE_ARN: a role only this repo's default-branch runs can
      # assume (aws/bootstrap enable_teardown_role), holding the deletes a
      # pull_request run must not -- the stores a PR created. Without it the
      # sweep releases forks but leaves those stores, and their bookmarks.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TEARDOWN_ROLE_ARN || vars.DATA_ROLE_ARN || vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.3"
          enable-cache: true

      - run: uv sync --frozen

      - name: Retire bookmarks of closed PRs
        run: |
          set -euo pipefail
          failed=""
          # Bookmarks live in the repository that holds the dataset (tether-env.sh).
          for ref in $(git -C "$DATASET_ROOT" ls-remote --heads origin 'pr[0-9]*' | awk '{print $2}'); do
            bookmark="${ref#refs/heads/}"
            number="${bookmark#pr}"
            pr_state=$(gh pr view "$number" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            case "$pr_state" in
              OPEN) echo "$bookmark: PR open, keeping its forks" ;;
              UNKNOWN) echo "::warning::$bookmark: could not look up PR #$number; keeping its forks" ;;
              *) echo "$bookmark: PR $pr_state, retiring"
                 .github/scripts/tether-down.sh "$bookmark" || failed="$failed $bookmark" ;;
            esac
          done
          # One bookmark's failure must not strand the rest; report them all.
          if [ -n "$failed" ]; then
            echo "::error::could not retire:$failed"
            exit 1
          fi
