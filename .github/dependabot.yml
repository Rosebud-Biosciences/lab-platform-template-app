# Keeps every dependency surface fresh: uv.lock (Python), the pinned GitHub
# Actions (exact pins like setup-uv@v10.0.1 are bumped in place), the preview
# stack's Terraform providers/module refs, and the Dockerfile/compose base
# images (the build recipe is named Dockerfile rather than Containerfile
# precisely so this ecosystem can parse it; podman builds either).
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/preview"
    schedule:
      interval: "weekly"

  # Base images: the Dockerfile's python:*-slim plus compose's postgres.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # A dataset consumed from its own repository arrives as a git submodule
  # (README "Where the dataset lives"); data-pull.yml commits to THAT repo, so
  # the pointer here trails it until bumped. Uncomment to have Dependabot open
  # the bump PRs -- harmless noise otherwise, hence off while there is none.
  # - package-ecosystem: "gitsubmodule"
  #   directory: "/"
  #   schedule:
  #     interval: "daily"
