# Virtual workspace root: no [project] of its own, it just glues the packages
# together and hosts the shared dev tooling (pytest/ruff run from here reach
# every member).
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",   # FastAPI TestClient transport
    "ruff>=0.14",
    # Local `uv run alembic ...` without cd-ing into an image; the migrate extra
    # is also carried by the workflows package so the built image can migrate.
    "db[migrate]",
    "ty>=0.0.76",
    "tether-vcs[cli,delta,iceberg,icechunk,lance,neon,objectstore]>=0.1.0b6",
]

[tool.uv.sources]
db = { workspace = true }
dataset = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# marimo cells display a value by ending on a bare expression.
"**/notebooks/*.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = [
    "packages/app/tests",
    "packages/dataset/tests",
    "packages/db/tests",
    "packages/workflows/tests",
]
