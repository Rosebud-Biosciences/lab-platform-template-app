name: Preview Up

# Label-gated preview loop: previews cost real resources (a node, Neon
# branches, tailnet devices), so one exists only while its PR wears the
# `preview` label. Add the label to stand the preview up; each push refreshes
# it; remove the label (or close the PR) and preview-down.yml tears it down —
# including parking a preview mid-review without closing the PR.
#
# Build one image per deployable (podman — preinstalled on ubuntu runners),
# stand up (or update) the preview via the platform repo's reusable workflow,
# then run alembic against the preview's copy-on-write Neon branch.
#
# deployables.json is the single source of truth: it drives the build matrix
# here AND infra/preview derives its image references from the same file, so
# adding a deployable never touches this workflow. Tags are deterministic
# (<name>-pr<N>-<sha>), so no job depends on build outputs.
#
# The preview's DATA has two providers (README "Ephemeral data"). With the
# FORK_PROVIDER repository variable unset or "tofu", the stack stamps isolated
# empty copies and this workflow is the loop above. With "tether", the
# fork-data job first forks the PRODUCTION stores with tether (one branch per
# store per PR) and hands the addresses to the stack through the reusable
# workflow's extra_tfvars_json; nothing else changes. Both end in the same
# pods contract, DATABASE_URL + DATA_REFS.
#
# Requires (see README "Adopt this template"):
#   vars:    CI_ROLE_ARN, PREVIEW_ROLE_ARN, CLUSTER_NAME, AWS_REGION, ECR_REPOSITORY
#            tether mode: FORK_PROVIDER=tether, optionally DATA_ROLE_ARN (a role
#            holding the data-access policy; defaults to PREVIEW_ROLE_ARN) and
#            DATASET_ROOT (where tether.toml lives; default packages/dataset)
#   secrets: NEON_API_KEY, TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, and MODULES_GIT_TOKEN
#            while the platform repo is private (read-only Contents on it)

on:
  pull_request:
    types: [labeled, synchronize]

# One pipeline per PR; never cancel a terraform apply mid-flight.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # Every other job `needs` this one (directly or transitively), so this guard
  # gates the whole run: the exact `preview` label being added, or a push to a
  # PR that already wears it. Unlabeled PRs skip everything.
  meta:
    if: >-
      ${{ (github.event.action == 'labeled' && github.event.label.name == 'preview')
      || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview')) }}
    runs-on: ubuntu-latest
    outputs:
      deployables: ${{ steps.read.outputs.deployables }}
      registry: ${{ steps.registry.outputs.registry }}
      stamp: pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        run: echo "deployables=$(jq -c . deployables.json)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: registry
        run: >
          echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.meta.outputs.deployables) }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR (podman)
        run: >
          aws ecr get-login-password --region ${{ vars.AWS_REGION }}
          | podman login --username AWS --password-stdin "${{ needs.meta.outputs.registry }}"

      - name: Build and push
        env:
          IMAGE: ${{ needs.meta.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ matrix.package }}-${{ needs.meta.outputs.stamp }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # A package may override the shared recipe with its own Dockerfile.
          file="packages/$PKG/Dockerfile"
          [ -f "$file" ] || file=Dockerfile
          podman build -f "$file" --build-arg "TARGET_PACKAGE=$PKG" -t "$IMAGE" .
          podman push "$IMAGE"

  # tether mode only: fork every registered store onto bookmark pr<N> and emit
  # the fork's addresses + database URL for the stack. Checks out the PR HEAD
  # (not the merge ref) so the bookmark names a commit that exists on the PR,
  # and needs contents: write to push it. Forks require the data-plane rights of
  # modules/data-access, which DATA_ROLE_ARN carries (falls back to the preview
  # role -- grant it the policy). A failed fork fails the preview, loudly.
  fork-data:
    needs: meta
    if: ${{ vars.FORK_PROVIDER == 'tether' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      tfvars_b64: ${{ steps.fork.outputs.tfvars_b64 }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DATASET_ROOT: ${{ vars.DATASET_ROOT || 'packages/dataset' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true # a dataset consumed from its own repo rides in as a submodule

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DATA_ROLE_ARN || vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: astral-sh/setup-uv@v10.1.0  # no moving tags past v8; exact pin
        with:
          version: "0.11.3"
          enable-cache: true

      - run: uv sync --frozen

      - id: fork
        run: .github/scripts/tether-fork.sh "pr${{ github.event.pull_request.number }}"

  # Skipped fork-data (tofu mode) must not skip this job, hence the explicit
  # result check instead of the default all-succeeded rule.
  up:
    needs: [meta, build, fork-data]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.fork-data.result) }}
    uses: Rosebud-Biosciences/terraform-aws-lab-platform/.github/workflows/preview-up.yml@main
    with:
      preview_name: pr${{ github.event.pull_request.number }}
      working_directory: infra/preview
      role_to_assume: ${{ vars.PREVIEW_ROLE_ARN }}
      cluster_name: ${{ vars.CLUSTER_NAME }}
      aws_region: ${{ vars.AWS_REGION }}
      tailscale: true
      extra_apply_args: -var "image_base=${{ needs.meta.outputs.registry }}/${{ vars.ECR_REPOSITORY }}" -var "image_stamp=${{ needs.meta.outputs.stamp }}" -var "fork_provider=${{ vars.FORK_PROVIDER || 'tofu' }}"
    secrets:
      neon_api_key: ${{ secrets.NEON_API_KEY }}
      ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
      modules_git_token: ${{ secrets.MODULES_GIT_TOKEN }} # only while the platform repo is private
      # Empty in tofu mode (the job was skipped); the reusable workflow ignores it.
      extra_tfvars_json: ${{ needs.fork-data.outputs.tfvars_b64 }}

  # Schema of the PR lands on the PR's branched database — prod never sees it.
  # `tofu output app_database_url` is the tofu-mode Neon branch or the
  # tether-mode fork alike: the stack records whichever it was given.
  migrate:
    needs: up
    runs-on: ubuntu-latest
    env:
      PREVIEW_NAME: pr${{ github.event.pull_request.number }}
      MODULES_GIT_TOKEN: ${{ secrets.MODULES_GIT_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # tofu init fetches the platform's modules with git; while that repo is
      # private the runner needs a token that can read it (same secret the
      # reusable workflows take as modules_git_token).
      - name: Authenticate module fetches
        if: ${{ env.MODULES_GIT_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${MODULES_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false

      - uses: astral-sh/setup-uv@v10.1.0  # no moving tags past v8; exact pin
        with:
          version: "0.11.3"
          enable-cache: true

      - name: Read the branched DATABASE_URL from preview state
        id: dburl
        working-directory: infra/preview
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu workspace select "$PREVIEW_NAME"
          url="$(tofu output -raw app_database_url)"
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Sync from the root so the dev group's db[migrate] provides alembic.
      - name: Alembic upgrade head (Neon is reachable from the runner)
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
        run: |
          uv sync --frozen
          uv run alembic -c packages/db/alembic.ini upgrade head
