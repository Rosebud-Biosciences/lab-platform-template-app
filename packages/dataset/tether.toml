# tether dataset: the data this app reads and writes, one manifest per object
# under .tether/objects/. This directory is the dataset root AND the Python
# package (src/dataset) that names these objects in code; the enclosing git/jj
# repository is the app's, so a commit names code and data together. A dataset
# shared by several codebases moves to a repository of its own and comes back
# as a git submodule (README "Where the dataset lives").
#
# Every locator below is a placeholder (your-data-bucket, your-neon-project,
# the table bucket ARN): adopting the template means `tether add` / editing
# them to your real stores -- see README "Ephemeral data" and "Adopt this
# template". Nothing is contacted until a command asks for a state.
#
# `tether upgrade` migrates this file when tether's format moves on; it
# rewrites the file without these comments, so carry them over.

[tether]
version = 5

[dataset]
id = "6e117556"

[snapshot]
auto = false

[verify]
on_status = false

[new]
# Previews fork every object up front (CI's fork-data job runs `tether new -b
# pr<N>`), so the branch names it hands the pods exist before the first write.
fork = "eager"

[defaults]
file = "immutable"
pin = "native"

# pyiceberg catalog for every iceberg object (lake/*, catalog_name
# "s3tables"): S3 Tables' Iceberg REST catalog, `warehouse` its table bucket
# ARN. A committed file may name no endpoint, so the rest -- uri and SigV4
# signing -- comes from the environment (PYICEBERG_CATALOG__S3TABLES__*, which
# .github/scripts/tether-env.sh exports from AWS_REGION) or, on a laptop, the
# untracked .tether/secrets.toml, whose [backends.iceberg.catalog] replaces
# this table (so it repeats type and warehouse). The app's own openers read
# the ICEBERG_CATALOG env var instead and never this table.
[backends.iceberg.catalog]
type = "rest"
warehouse = "arn:aws:s3tables:us-west-2:123456789012:bucket/your-table-bucket"
