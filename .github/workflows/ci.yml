name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The preview stack (infra/preview): formatted, and valid against the
  # platform modules it pins.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false

      - run: tofu fmt -check -recursive -diff infra

      - run: tofu -chdir=infra/preview init -backend=false -input=false

      - run: tofu -chdir=infra/preview validate

  test:
    runs-on: ubuntu-latest
    # Row-level security is PostgreSQL's: its tests (TEST_POSTGRES_URL) need a
    # real server; the rest of the suite runs on SQLite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.3"
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: uv run ty check

      - run: uv run pytest
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

      # The dev group (pytest, httpx, ...) is installed above, which can hide
      # a missing runtime dependency. Import each deployable's entrypoint in an
      # environment with its runtime dependencies only, as its image has.
      - name: Deployables import with runtime dependencies only
        run: |
          uv run --frozen --isolated --no-dev --package app python -c "import app.main"
          uv run --frozen --isolated --no-dev --package workflows python -c "import workflows"
